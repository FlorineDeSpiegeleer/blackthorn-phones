<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0e1115">
  <title>Blackthorn Academy — Projector</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="projector"></main>

  <aside id="gmPanel" class="gm-panel" hidden>
    <div class="gm-head">
      <strong>GM CONTROL</strong>
      <button id="gmClose" aria-label="Sluiten">×</button>
    </div>
    <div class="gm-grid">
      <button id="prevStep">← Vorige stap</button>
      <button id="nextStep">Volgende stap →</button>
      <label>Scène
        <select id="sceneJump"></select>
      </label>
      <button id="resetScene">Reset scène</button>
    </div>
    <p class="gm-note">Druk op <kbd>G</kbd> om dit paneel te tonen/verbergen.</p>
  </aside>

  <script src="v63-scenes.js"></script>
  <script src="projector.js"></script>
</body>
</html>
